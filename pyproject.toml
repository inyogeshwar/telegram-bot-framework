[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot-framework"
version = "1.0.0"
description = "The most comprehensive, AI-first, enterprise-grade developer handbook for building Telegram bots with Python."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Yogeshwar Kumar", email = "yogeshwar853202@gmail.com"}
]
keywords = ["telegram", "bot", "python", "python-telegram-bot", "chatbot", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/inyogeshwar/telegram-bot-framework"
Documentation = "https://github.com/inyogeshwar/telegram-bot-framework/tree/main/docs"
Repository = "https://github.com/inyogeshwar/telegram-bot-framework"
Issues = "https://github.com/inyogeshwar/telegram-bot-framework/issues"
Changelog = "https://github.com/inyogeshwar/telegram-bot-framework/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
job-queue = [
    "python-telegram-bot[job-queue]>=21.0",
]
redis = [
    "redis>=5.0",
]
postgres = [
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
]
all = [
    "python-telegram-bot[job-queue]>=21.0",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
]

[tool.ruff]
target-version = "py39"
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["bot"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
